<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple N-gram Text Generator</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
  textarea { width: 100%; height: 150px; }
  input { width: 70px; }
  button { margin-top: 10px; padding: 8px 16px; }
  #output { margin-top: 16px; padding: 10px; background: #eee; min-height: 40px; }
</style>
</head>
<body>
  <h1>N-gram Text Generator</h1>
  <p>Paste some text. The program learns which words follow each other and writes new text.</p>

  <textarea id="text">Students learn best when they can express their ideas in the language they understand. A good assistant helps students ask questions, read notes and write answers in their own language. Teachers can explain difficult ideas in simple words. Students can share their ideas with classmates and friends. Small steps help students make progress. Clear examples help students remember what they learn.</textarea>

  <p>
    n (1-5): <input id="n" type="number" min="1" max="5" value="2">
    &nbsp; Words to write: <input id="len" type="number" min="5" max="200" value="30">
  </p>

  <button onclick="generate()">Generate</button>
  <div id="output"></div>

<script>
function generate() {
  const words = document.getElementById("text").value.toLowerCase().split(/\s+/).filter(Boolean);
  const n = parseInt(document.getElementById("n").value) || 2;
  const len = parseInt(document.getElementById("len").value) || 30;
  const size = n; // how many words we look back at (n = 1 means 1 previous word)

  if (words.length <= size) {
    document.getElementById("output").textContent = "Please add more text.";
    return;
  }

  // Learn: for each group of `size` words, remember the word that came next
  const next = {};
  for (let i = 0; i + size < words.length; i++) {
    const key = words.slice(i, i + size).join(" ");
    if (!next[key]) next[key] = [];
    next[key].push(words[i + size]);
  }

  // Generate: start at a random place, then keep picking a next word
  const keys = Object.keys(next);
  let current = keys[Math.floor(Math.random() * keys.length)].split(" ");
  const result = [...current];

  for (let i = 0; i < len; i++) {
    const options = next[current.join(" ")];
    if (!options) break; // dead end
    const pick = options[Math.floor(Math.random() * options.length)];
    result.push(pick);
    current = result.slice(-size);
  }

  document.getElementById("output").textContent = result.join(" ");
}
</script>
</body>
</html>
